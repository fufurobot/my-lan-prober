name: CI

# The interesting cases for this project are not "does it import" but:
#   * the suite is hermetic — it must never touch the network, because the
#     tool's whole job is to scan a LAN and a CI runner has no LAN to scan;
#   * the framing/persistor logic is platform-sensitive (Windows path and
#     ACL behaviour has already produced one real bug);
#   * `uv.lock` is gitignored, so dependency resolution happens fresh here.
# NOTE: `on` is quoted because unquoted it is parsed as the boolean true by
# YAML 1.1 loaders (GitHub Actions itself is fine either way, but local
# validators and linters otherwise see a key named `True`).
"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel a run that a newer push to the same ref supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep uv's output stable and non-interactive in CI.
  UV_NO_PROGRESS: "1"
  UV_PRERELEASE: "disallow"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.10

      # `dev` is a dependency-group, so it comes in with a plain sync.
      - name: Sync dependencies
        run: uv sync --python 3.10

      - name: ruff format --check
        run: uv run ruff format --check --diff src tests

      - name: ruff check
        run: uv run ruff check --output-format=github src tests

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor; 3.13 is what the project ran on before
        # moving to uv-managed interpreters, so both ends are worth keeping.
        # Windows runs the floor only: it is the platform where the real
        # path/temp/ACL bugs appeared, and one leg there is enough coverage
        # per push without doubling the slowest runner.
        python: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest]
        exclude:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Run tests
        run: uv run pytest -q

      # The suite must pass without any optional extra installed: `playwright`,
      # `asyncssh` and friends are extras, and a bare `uv sync` is what a
      # contributor and CI both get. Guard against a module-level import of an
      # optional dependency sneaking back in.
      #
      # This runs in its own isolated environment built from the project
      # (`--with .` pulls core dependencies only), so it depends on the
      # package metadata alone rather than on whatever earlier steps left in
      # the job's venv.
      #
      # `shell: bash` is explicit because windows-latest defaults to
      # PowerShell, where `set -euo pipefail` is not a valid command.
      - name: Run tests without optional extras
        shell: bash
        run: |
          set -euo pipefail
          uv run --isolated --no-project --with pytest --with pytest-asyncio --with . \
            python -c "
          import importlib.util as u
          for extra in ('playwright', 'asyncssh', 'openai', 'zeroconf', 'pyarrow'):
              assert u.find_spec(extra) is None, f'{extra} unexpectedly installed'
          print('optional extras confirmed absent')
          "
          uv run --isolated --no-project --with pytest --with pytest-asyncio --with . \
            pytest tests/test_smoke.py -q -rs

      # The smoke tests are the ones that caught the MSYS2/`os.tmpdir()`
      # Playwright failure; they are worth surfacing separately rather than
      # being buried in the aggregate count.
      - name: Run environment smoke tests
        run: uv run pytest tests/test_smoke.py -v

  hermetic:
    name: Tests must not touch the network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Install first, with the network available — then cut the network and
      # run. Doing both at once would fail on dependency download instead of
      # on the behaviour we actually care about.
      - name: Sync dependencies
        run: uv sync --python 3.10

      # A scanning tool's suite passing on a machine with a LAN would be a
      # false positive: DNS, ICMP and port probes all "succeed" against real
      # neighbours. Unshare the network namespace so a test that reaches out
      # to the LAN fails the build loudly.
      #
      # A fresh network namespace has no usable interfaces, not even loopback,
      # so tests using 127.0.0.1 or socketpair() — genuinely local, and
      # legitimate — would die with "Network is unreachable". Bringing `lo` up
      # restores exactly those while leaving every route off-host gone.
      #
      # `lo` is brought up best-effort: if `ip` is unavailable the run still
      # executes, and the localhost tests fail loudly enough to be noticed
      # rather than the whole step erroring out on a missing tool.
      #
      # Two more details:
      #   * `uv` must be an absolute path — inside the namespace the inherited
      #     PATH does not find the shim ("failed to execute uv");
      #   * no `--map-root-user`: it rewrites the uid and the runner user then
      #     cannot read its own uv cache ("failed to open uv.toml").
      # `sudo -E` keeps PATH and the uv cache/home variables intact.
      - name: Run tests with network access blocked
        run: |
          set -euo pipefail
          UV_BIN="$(command -v uv)"
          echo "uv: ${UV_BIN}"
          sudo -E unshare --net bash -c '
            set -uo pipefail
            if command -v ip >/dev/null 2>&1; then
              ip link set lo up || echo "warning: could not bring lo up"
              ip -brief addr show || true
            else
              echo "warning: iproute2 not found; loopback may be unavailable"
            fi
            exec "$0" run --no-sync pytest -q
          ' "${UV_BIN}"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist and wheel
        run: uv build

      # Prove the console script is wired up and the package imports from the
      # built artifact, not just from the checkout. Resolve the wheel path
      # explicitly rather than relying on shell globbing.
      - name: Smoke test the built wheel
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          echo "testing ${wheel}"
          uv run --isolated --no-project --with "${wheel}" my-lan-prober --help
          uv run --isolated --no-project --with "${wheel}" \
            python -c "import my_lan_prober; print(my_lan_prober.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
