[project]
name = "my-lan-prober"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fufu", email = "fufurobot@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "python-hosts>=1.1.3",
    "dnspython>=2.8.0",
    "tqdm>=4.70.1",
]

[project.scripts]
my-lan-prober = "my_lan_prober:main"

[project.optional-dependencies]
ssh = [
    "asyncssh>=2.24.0",
]
vnc = [
    "asyncvnc>=1.3.0",
]
openai = [
    "openai>=3.22.1",
]
mdns = [
    "zeroconf>=0.151.5",
]
playwright = [
    "playwright>=1.63.0",
]
arrow = [
    "pyarrow>=25.0.1",
]
wifi = [
    "pywifi>=1.1.12",
]
bluetooth = [
    "bleak>=3.0.2",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
# The standalone reference script the package was ported from is checked (it
# must stay valid, runnable Python) but not linted: it deliberately mirrors the
# original file's layout rather than the package's import-sorting and
# modern-syntax rules.  `tests/test_reference_script.py` guards its substance.
exclude = ["tplogin-minimal.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The dataclass-style Optional[...] annotations read better than X | None
    # in the LayerSpec table, where every field is documented.
    "UP045",
    "UP006",
    "UP035",
    "UP037",
    "RUF022",
    # LayerSpec.reset/framing defaults are deliberately empty no-ops.
    "B027",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use broad asserts, long literal fixtures, and blind excepts.
"tests/*" = ["BLE001", "B017", "E501", "SIM"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-requests>=2.33.0.20260906",
    "python-dotenv>=1.0.0"
]
